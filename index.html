<!DOCTYPE html>
<html lang="hi" data-style="nothing" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nuclear System">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Nuclear System: a 20-point daily discipline tracker with weekly goals.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Nuclear System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Manrope:wght@500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a14;
  --card: rgba(26,28,48,.94);
  --solid: #16182a;
  --fill: rgba(255,255,255,.06);
  --fill-hover: rgba(255,255,255,.1);
  --ink: #eef0ff;
  --mute: #9296b3;
  --line: rgba(255,255,255,.1);
  --line-strong: rgba(255,255,255,.2);
  --brand: #6c5ce7;
  --brand2: #ff6aa2;
  --brand-glow: rgba(108, 92, 231, 0.35);
  --ok: #16a765;
  --warn: #f59e0b;
  --bad: #ef4444;
  --sh: inset 0 1px 0 rgba(255,255,255,.08), 0 16px 36px -14px rgba(0,0,0,.6);
  --blur: none;
  --radius: 26px;
  --ring-off: rgba(255,255,255,.2);
  --brand-ink: var(--brand);
  --on-brand: #fff;
  --on-hero: #fff;
  color-scheme: dark;
}

:root[data-theme="light"] {
  color-scheme: light;
  --ring-off: rgba(20,20,60,.14);
  --bg: #f5f5fb;
  --card: rgba(255,255,255,.95);
  --solid: #ffffff;
  --fill: rgba(28,28,90,.05);
  --fill-hover: rgba(28,28,90,.09);
  --ink: #12142b;
  --mute: #70748e;
  --line: rgba(30,30,90,.1);
  --line-strong: rgba(30,30,90,.2);
  --sh: inset 0 1px 0 rgba(255,255,255,.9), 0 16px 34px -14px rgba(40,40,110,.16);
}

/* NOTHING OS PURE GLYPH MODE */
[data-style="nothing"] {
  --bg: #000000;
  --card: rgba(16, 17, 20, 0.94);
  --solid: #151619;
  --fill: rgba(255, 255, 255, 0.06);
  --fill-hover: rgba(255, 255, 255, 0.11);
  --ink: #f5f5f5;
  --mute: #80828a;
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.22);
  --brand: #eb0028;
  --brand2: #eb0028;
  --brand-glow: rgba(235, 0, 40, 0.45);
  --ok: #f5f5f5;
  --warn: #80828a;
  --bad: #eb0028;
  --sh: none;
  --radius: 28px;
}
:root[data-style="nothing"][data-theme="light"] {
  --bg: #e6e6e8;
  --card: rgba(244, 244, 246, 0.95);
  --solid: #ffffff;
  --fill: rgba(0, 0, 0, 0.05);
  --fill-hover: rgba(0, 0, 0, 0.09);
  --ink: #0a0a0b;
  --mute: #62646c;
  --line: rgba(0, 0, 0, 0.12);
  --line-strong: rgba(0, 0, 0, 0.22);
  --brand: #d71921;
  --brand2: #d71921;
  --brand-glow: rgba(215, 25, 33, 0.25);
  --ok: #0a0a0b;
  --warn: #62646c;
  --bad: #d71921;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html { touch-action: pan-x pan-y; background: var(--bg); overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 500 15px/1.5 "Manrope", system-ui, sans-serif;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  user-select: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  transform: translateZ(0);
  contain: strict;
  background: radial-gradient(600px 420px at 92% -8%, color-mix(in srgb, var(--brand) 26%, transparent), transparent 70%),
              radial-gradient(520px 420px at -12% 22%, color-mix(in srgb, var(--brand2) 18%, transparent), transparent 70%);
  pointer-events: none;
}
[data-style="nothing"] body::before {
  background: radial-gradient(circle, color-mix(in srgb, var(--ink) 13%, transparent) 1px, transparent 1.6px) 0 0/20px 20px;
}

h1, h2, .num, .big, .pct, .tv, .rt, .mc b, .dchip b, .step .v {
  font-family: Sora, Manrope, system-ui, sans-serif;
}
[data-style="nothing"] h1, [data-style="nothing"] .big, [data-style="nothing"] .tv, [data-style="nothing"] .mc b, [data-style="nothing"] .rt, [data-style="nothing"] .dchip b, [data-style="nothing"] .step .v {
  font-family: 'Doto', 'Space Mono', monospace;
  font-weight: 900;
  letter-spacing: 0;
}
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; margin: 4px 0 2px; }
h2 { font-size: 14.5px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 3px; }
[data-style="nothing"] h1 { font-size: 28px; text-transform: uppercase; }
[data-style="nothing"] h2 { font-family: 'Space Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }

.sub, .note { color: var(--mute); font-size: 12px; margin: 2px 0 8px; line-height: 1.4; }
[data-style="nothing"] .cat, [data-style="nothing"] .sub, [data-style="nothing"] .hi, [data-style="nothing"] .hs, [data-style="nothing"] .hs2, [data-style="nothing"] .chip, [data-style="nothing"] .dn small, [data-style="nothing"] .dchip small, [data-style="nothing"] .mc small, [data-style="nothing"] .mc span, [data-style="nothing"] .tl, [data-style="nothing"] .chd small, [data-style="nothing"] .chd b, [data-style="nothing"] .wd span, [data-style="nothing"] .pills span, [data-style="nothing"] .chips span, [data-style="nothing"] .tabs span, [data-style="nothing"] .wpill, [data-style="nothing"] .seg, [data-style="nothing"] select, [data-style="nothing"] .badge {
  font-family: 'Space Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .06em;
  font-size: 10.5px;
  font-weight: 700;
}

.mute { color: var(--mute); }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }

.wrap {
  max-width: 530px;
  margin: 0 auto;
  padding: 14px 16px 125px;
}
.wrap > * { animation: slideIn .26s cubic-bezier(.16, 1, .3, 1) backwards; }
.wrap.noanim > * { animation: none; }
@media (prefers-reduced-motion: reduce) { .wrap > * { animation: none; } }
@keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Glyph Header Bar */
.nbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 2px 2px 16px;
  font: 700 11px "Space Mono", monospace;
  letter-spacing: .16em;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 12px;
}
.led {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
  box-shadow: 0 0 12px var(--brand);
  animation: glyphPulse 2.4s infinite;
  will-change: opacity;
}
@keyframes glyphPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.nbar em { margin-left: auto; font-style: normal; color: var(--mute); font-size: 10px; }

.bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* Cards & Hero */
.dcard {
  background: var(--card);
    border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--sh);
  padding: 18px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}

.hero {
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  color: #fff;
  border-radius: 32px;
  padding: 22px 24px;
  margin-bottom: 14px;
  background: linear-gradient(135deg, var(--brand), var(--brand2));
  box-shadow: 0 20px 44px -16px var(--brand-glow);
}
[data-style="nothing"] .hero {
  background: var(--card) !important;
  color: var(--ink) !important;
  border: 1px solid var(--line-strong);
  box-shadow: 0 20px 40px -18px rgba(0,0,0,0.9);
}
.hero::after {
  content: "";
  position: absolute;
  right: -30px;
  bottom: -30px;
  width: 160px;
  height: 160px;
  background: radial-gradient(circle, var(--brand-glow) 0%, transparent 70%);
  pointer-events: none;
}
.hero.dh { flex-direction: column; align-items: stretch; gap: 12px; }
.hero .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }

.hi { font-size: 11px; font-weight: 700; color: var(--mute); display: flex; align-items: center; gap: 6px; }
.hi::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand);
}
.big { font-size: 56px; line-height: 0.95; margin-top: 6px; }
.big small { font-family: 'Space Mono', monospace; font-size: 16px; color: var(--mute); font-weight: 700; margin-left: 4px; }
.hs { font-size: 11.5px; color: var(--mute); margin-top: 6px; letter-spacing: 0.04em; }
.hs2 { font-size: 12px; text-align: right; line-height: 1.4; font-family: 'Space Mono', monospace; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  background: var(--fill);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 10.5px;
  font-weight: 700;
}

/* Pills & Week Tape */
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.pills span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--fill);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 7px 14px;
  border-radius: 99px;
}

.wkrow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 12px; }
.dchip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 9px 0;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 18px;
  cursor: pointer;
  color: var(--ink);
  transition: transform .15s, background .15s, border-color .15s;
}
.dchip:active { transform: scale(0.94); }
.dchip small { font-size: 9.5px; color: var(--mute); }
.dchip b { font-size: 15px; }
.dchip i {
  display: block;
  width: 50%;
  height: 3px;
  border-radius: 2px;
  margin-top: 4px;
  background: linear-gradient(90deg, var(--brand) calc(var(--p)*1%), var(--line) 0);
}
.dchip.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.dchip.on small { color: var(--bg); opacity: 0.85; }
.dchip.on i {
  background: linear-gradient(90deg, var(--brand) calc(var(--p)*1%), color-mix(in srgb, var(--bg) 35%, transparent) 0);
}

/* Navigation & Date Picker */
.dnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
.back {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 99px;
  padding: 9px 16px;
  font: 700 11px 'Space Mono', monospace;
  text-transform: uppercase;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: transform .12s, border-color .15s;
}
.back:active { transform: scale(0.95); border-color: var(--ink); }
.dnav .back.sq { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; border-radius: 50%; flex: none; }

.dpick {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 99px;
  background: var(--card);
  border: 1px solid var(--line);
  cursor: pointer;
}
.dpick small { display: block; color: var(--mute); font-size: 9px; }
.dpick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

/* Checklist Toolbar */
.tbar { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; gap: 8px; }
.tlabel { font: 700 11px 'Space Mono', monospace; letter-spacing: .06em; }
.btn-mini {
  border: 1px solid var(--line);
  background: var(--fill);
  color: var(--mute);
  padding: 6px 13px;
  border-radius: 99px;
  font: 700 10px 'Space Mono', monospace;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color .15s, color .15s, border-color .15s, opacity .15s, transform .15s;
}
.btn-mini:hover, .btn-mini:active { color: var(--ink); background: var(--fill-hover); border-color: var(--ink); }

.cat { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--brand-ink); margin: 16px 0 6px; text-transform: uppercase; }
.chd { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.cic {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  background: var(--solid);
  border: 1px solid var(--line);
  color: var(--brand-ink);
}
.chd b { display: block; font-size: 12px; font-weight: 800; }
.chd small { color: var(--mute); font-size: 11px; }

/* Checkboxes */
.chk {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 13px 15px;
  margin: 7px 0;
  border-radius: 20px;
  background: var(--fill);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .12s;
}
.chk:active { transform: scale(0.98); }
.chk.done {
  background: var(--fill-hover);
  border-color: var(--line);
}
.chk.done span {
  color: var(--mute);
  text-decoration: line-through;
}
.chk input {
  appearance: none;
  -webkit-appearance: none;
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid var(--mute);
  background: transparent;
  display: grid;
  place-content: center;
  cursor: pointer;
  transition: background-color .18s, color .18s, border-color .18s, opacity .18s, transform .18s;
}
.chk input:checked {
  background: var(--brand);
  border-color: var(--brand);
  box-shadow: 0 0 12px var(--brand-glow);
}
.chk input:checked::after {
  content: "";
  width: 4px;
  height: 8px;
  border: solid var(--on-brand);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}

textarea, input { user-select: text; -webkit-user-select: text; }
textarea, input:not([type=checkbox]):not([type=file]), select {
  font: inherit;
  color: inherit;
  border: 1px solid var(--line);
  background: var(--fill);
  border-radius: 18px;
  padding: 11px 15px;
  box-sizing: border-box;
}
textarea:focus, input:focus, select:focus {
  outline: none;
  border-color: var(--brand);
  background: var(--solid);
}
.mn, .inp { width: 100%; display: block; }
.mn { resize: vertical; min-height: 48px; line-height: 1.4; margin-top: 6px; }

/* Dashboard Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.tile .ic {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--fill);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--ink);
}
.tile .tv { font-size: 26px; line-height: 1.1; margin-top: 8px; }
.tile .tv small { font-size: 13px; color: var(--mute); font-family: 'Space Mono', monospace; }
.tile .tl { font-size: 10.5px; color: var(--mute); margin-top: 2px; }

/* Review Months Grid */
.mg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 15px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform .15s, border-color .15s;
}
.mc:active { transform: scale(0.97); }
.mc.cur { border-color: var(--brand); outline: 2px solid var(--brand); }
.mc small { display: block; font-size: 11.5px; color: var(--mute); }
.mc b { font-size: 26px; display: block; margin: 4px 0 2px; }
.mc span { font-size: 10px; color: var(--mute); }
.mc i { position: absolute; left: 0; bottom: 0; height: 3.5px; background: var(--brand); }
.mc.empty b, .mc.empty span { color: var(--mute); opacity: .7; }

/* Day Editor Row */
.day {
  display: grid;
  grid-template-columns: 74px 1fr;
  gap: 8px 12px;
  align-items: center;
  padding: 13px;
  margin-top: 8px;
  border-radius: 20px;
  background: var(--fill);
  border: 1px solid var(--line);
}
.dn { font-size: 13px; }
.dn small { display: block; color: var(--mute); font-size: 10px; }
.step {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-self: start;
  background: var(--solid);
  border-radius: 99px;
  padding: 3px 10px 3px 4px;
  border: 1px solid var(--line);
}
.step button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 0;
  background: var(--fill);
  color: var(--ink);
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}
.step button:active { background: var(--fill-hover); }
.step .v { min-width: 26px; text-align: center; font-size: 16px; }
.day textarea { grid-column: 1 / -1; margin: 0; background: var(--solid); }

.mini { display: flex; align-items: flex-end; gap: 3px; height: 44px; margin-top: 10px; }
.mini i { flex: 1; background: repeating-linear-gradient(0deg, var(--ink) 0 4px, transparent 4px 6px); opacity: 0.85; }

.wpill { font-size: 11px; padding: 4px 11px; border-radius: 99px; background: var(--solid); color: var(--ink); border: 1px solid var(--line); }

.wd { display: grid; grid-template-columns: 36px 1fr 44px; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.wd span { color: var(--mute); font-size: 11px; }
.wd b { text-align: right; font-size: 12px; }
.wb { height: 10px; background: repeating-linear-gradient(90deg, var(--fill) 0 5px, transparent 5px 8px); }
.wb i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--brand) 0 5px, transparent 5px 8px); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips span { border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 11px; }

.hr { display: flex; gap: 2px; align-items: center; margin: 3px 0; }
.hr b { width: 34px; flex: none; font-size: 9.5px; color: var(--mute); }
.hr i { flex: none; display: block; width: calc((100% - 34px)/31 - 2px); aspect-ratio: 1; border-radius: 50%; background: var(--fill); }

.segs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.seg {
  flex: 1;
  min-width: 80px;
  border: 1px solid var(--line);
  background: var(--fill);
  color: var(--ink);
  border-radius: 99px;
  padding: 11px 14px;
  font: 700 11px 'Space Mono', monospace;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color .15s, color .15s, border-color .15s, opacity .15s, transform .15s;
}
.seg:active { transform: scale(0.97); }
.seg.on {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.seg.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.seg.danger:active { background: var(--bad); color: #fff; }

.theme-switch-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 14px 18px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--fill);
  color: var(--ink);
  font: 700 12px 'Space Mono', monospace;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .12s;
  margin: 8px 0;
}
.theme-switch-btn:active { transform: scale(0.98); }
.theme-switch-btn span { display: inline-flex; align-items: center; gap: 8px; }
.theme-badge {
  background: var(--ink);
  color: var(--bg);
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 10px;
}

.sw { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }

/* Floating Bottom Navigation Bar */

}

  height: 5px;

/* =========================================================
   MODERN GLASS — complete theme (dark + light, any accent)

/* header */

[data-style="modern"] .hero .chip { background: color-mix(in srgb, var(--on-hero) 16%, transparent); border-color: color-mix(in srgb, var(--on-hero) 30%, transparent); color: var(--on-hero); }

/* chips, pills, labels */

[data-style="modern"] .pills span { font: 700 12px Manrope, system-ui, sans-serif; color: #fff; border: 0; text-shadow: 0 1px 2px rgba(0,0,0,.25); box-shadow: 0 8px 18px -10px rgba(0,0,0,.55); }

/* buttons */

[data-style="modern"] .btn-mini,
[data-style="modern"] .seg,
[data-style="modern"] .theme-switch-btn { font-family: Manrope, system-ui, sans-serif; text-transform: none; letter-spacing: 0; }

[data-style="modern"] .theme-badge { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: var(--on-hero); border-color: transparent; }

/* week strip */

/* tiles, months, bars */

[data-style="modern"] .wb i { background: linear-gradient(90deg, var(--brand), var(--brand2)); border-radius: 99px; }
[data-style="modern"] .mini { gap: 4px; }

/* bottom nav */
[data-style="modern"] .tabs { background: color-mix(in srgb, var(--solid) 78%, transparent); border-color: var(--line-strong); box-shadow: 0 18px 40px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }

[data-style="modern"] .tabs button { font-family: Manrope, system-ui, sans-serif; font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: 0; }
[data-style="modern"] .tabs button.on { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: var(--on-hero); box-shadow: 0 8px 18px -8px var(--brand-glow); }
[data-style="modern"] .tabs button.on::after { display: none; }

/* ---------- UI polish round 3 ---------- */
:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }
.chk input:focus-visible { outline-offset: 3px; }
.chk span { min-width: 0; overflow-wrap: anywhere; }

/* settings: task / category rows get their own full-width name field */
.trow.tedit { flex-wrap: wrap; background: var(--fill); border: 1px solid var(--line); border-radius: 20px; padding: 10px; gap: 8px; margin: 8px 0; }
.trow.tedit .inp { flex: 1 1 100%; background: var(--solid); order: 0; }

/* colour swatches: one tidy row of 8 */
.sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.swb { width: 100%; height: auto; aspect-ratio: 1; }

/* week strip: marker for today */
.dchip { position: relative; }
.dchip.today::after { content: ""; position: absolute; top: 6px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }

/* month view rows */
.day.today { border-color: var(--brand); }
.day.rest { opacity: .55; }
.day textarea { min-height: 40px; height: 40px; resize: none; padding: 9px 14px; transition: height .15s; }
.day textarea.has, .day textarea:focus { height: 72px; }

/* date picker: keep on one line on small phones */

.dnav .back { padding: 9px 13px; }

/* danger icon */

/* ---------- task scheduling ---------- */
.trow.tedit .schbtn { order: 4; flex: 1 1 100%; }

.schbtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--solid); color: var(--ink); font: 600 12.5px/1.3 Manrope, system-ui, sans-serif; text-align: left; cursor: pointer; transition: border-color .15s, transform .12s; }
.schbtn span { flex: 1; min-width: 0; }

.dp.on { background: var(--brand); color: var(--on-brand); border-color: transparent; }

.srep { width: 100%; }
.dnames { display: flex; flex-direction: column; gap: 6px; }
.dn { display: flex; align-items: center; gap: 8px; }

/* ---------- danger zone + confirm dialog ---------- */

#modal:empty { display: none; }
.mscrim { position: fixed; inset: 0; z-index: 200; border: 0; padding: 0; background: rgba(0,0,0,.72); animation: mfade .2s both; cursor: default; }
.sheet { position: fixed; z-index: 201; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 32px); max-width: 400px; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--solid); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 28px; padding: 22px 20px 20px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.85); animation: sheetIn .26s cubic-bezier(.16, 1, .3, 1) both; user-select: text; }
.sicon { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); margin-bottom: 12px; }
.mtitle { font-size: 20px; margin: 0 0 6px; }
.dlist { margin: 0 0 14px; padding: 12px 14px 12px 32px; border-radius: 16px; background: var(--fill); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.7; }

.mn { resize: none; }
.x.arm { width: auto; min-width: 40px; padding: 0 14px; border-radius: 99px; background: var(--bad); border-color: var(--bad); color: #fff; font: 700 12px Manrope, system-ui, sans-serif; }

.fld + .fld { margin-top: 16px; }

/* Nuke mission card (premium) */
.nk-mis { position: relative; padding: 16px 18px; border: 1px solid transparent; border-radius: 30px;

function agg(keys, fullPeriod = false) {
  const today = TD();
  let s = 0, loggedDays = 0, workingDaysCount = 0, elapsedDen = 0, eligibleDays = 0;
  // Full-period target is 20 points per eligible working day in this exact date range.
  // A month-week containing only Thu–Sat therefore has a 60-point target, not 120.
  keys.forEach(k => { if (k >= FIRSTK && maxFor(k) > 0) eligibleDays++; });
  keys.forEach(k => {
    if (k > today || k < FIRSTK) return;
    const mx = maxFor(k); if (!mx) return;
    const dd = dayDone(k); if (k === today && dd == null) return;
    workingDaysCount++; elapsedDen += 20;
    if (dd != null) { s += Math.min(dd, 20); loggedDays++; }
  });
  const d = fullPeriod ? eligibleDays * 20 : elapsedDen;
  return { s, n: loggedDays, d, workingDays: workingDaysCount, eligible: eligibleDays, elapsed: elapsedDen,
    // p = score against the period's FULL target (fullPeriod) or elapsed days; pace = score on elapsed days only
    pace: loggedDays > 0 && elapsedDen > 0 ? Math.min(100, (s / elapsedDen) * 100) : null,
    p: loggedDays > 0 && d > 0 ? Math.min(100, (s / d) * 100) : null };
}
const n1 = x => String(Math.round((Number(x) || 0) * 10) / 10);

// ---------------- WEEKLY GOAL ENGINE ----------------
function weekGoal(k) {
  const md = monday(k), wk = [], today = TD();
  for (let i = 0; i < 7; i++) { const x = new Date(md); x.setDate(md.getDate() + i); wk.push(ks(x.getFullYear(), x.getMonth(), x.getDate())); }
  const a = agg(wk, true);
  const target = a.d * GOAL / 100;            // points needed to hit the weekly goal %
  let room = 0, daysLeft = 0;                 // points still earnable + days still available
  wk.forEach(x => {
    if (x < FIRSTK || !maxFor(x)) return;
    if (x > today) { room += 20; daysLeft++; }
    else if (x === today) { const dd = Math.min(20, dayDone(x) || 0); if (dd < 20) { room += 20 - dd; daysLeft++; } }
  });
  const need = Math.max(0, target - a.s);
  const pct = a.d > 0 ? Math.min(100, a.s / a.d * 100) : 0;
  const maxPct = a.d > 0 ? Math.min(100, (a.s + room) / a.d * 100) : 0;
  const past = wk[6] < today;
  let state = "none";
  if (a.d > 0) state = a.s >= target - 1e-9 ? "hit" : (a.s + room < target - 1e-9 ? "missed" : "track");
  return { wk, a, target, need, room, daysLeft, perDay: daysLeft ? need / daysLeft : 0, pct, maxPct, past, state };
}
function weekGoalCard(k) {
  const g = weekGoal(k), a = g.a;
  if (!a.d) return `<div class="dcard"><div class="chd"><span class="cic">${ic("target",20)}</span><div><b>WEEKLY GOAL</b><small>No working days tracked in this week</small></div></div></div>`;
  const col = g.state === "hit" ? "var(--ok)" : g.state === "missed" ? "var(--bad)" : "var(--warn)";
  const label = g.state === "hit" ? "GOAL HIT" : g.state === "missed" ? (g.past ? "MISSED" : "OUT OF REACH") : "ON TRACK";
  const m0 = new Date(g.wk[0] + "T00:00:00"), m6 = new Date(g.wk[5] + "T00:00:00");
  const range = `${m0.getDate()} ${MN[m0.getMonth()].slice(0,3)} – ${m6.getDate()} ${MN[m6.getMonth()].slice(0,3)}`;
  let msg;
  if (g.state === "hit") msg = `Weekly goal achieved. ${g.room > 0 ? `${n1(g.room)} more points can still lift this week to ${Math.round(g.maxPct)}%.` : ""}`;
  else if (g.state === "missed") msg = g.past ? `Week ended at ${Math.round(g.pct)}% — ${n1(g.need)} points short of the ${GOAL}% goal.` : `${GOAL}% is out of reach now. Best possible this week: ${Math.round(g.maxPct)}%.`;
  else msg = `Need <b style="color:var(--ink)">${n1(g.need)} more points</b> in ${g.daysLeft} day${g.daysLeft === 1 ? "" : "s"} (about <b style="color:var(--ink)">${n1(g.perDay)}/day</b>) to reach ${GOAL}%.`;
  const days = g.wk.slice(0, 6).map(x => {
    const mx = maxFor(x), e = x >= FIRSTK && mx, dd = e ? Math.min(20, dayDone(x) || 0) : 0, dt = new Date(x + "T00:00:00");
    const fut = x > TD();
    return `<div style="flex:1;text-align:center;min-width:0"><div style="height:44px;background:var(--fill);border-radius:8px;position:relative;overflow:hidden;${x === TD() ? "outline:1.5px solid var(--brand);" : ""}${!e ? "opacity:.35;" : ""}"><i style="position:absolute;left:0;right:0;bottom:0;height:${dd / 20 * 100}%;background:${fut ? "var(--line-strong)" : "var(--brand)"}"></i></div><small class="mute" style="font-size:10px;display:block;margin-top:3px">${DN[dt.getDay()].slice(0,1)}</small></div>`;
  }).join("");
  return `<div class="dcard">
    <div class="row"><div class="chd" style="margin:0"><span class="cic">${ic("target",20)}</span><div><b>WEEKLY GOAL · ${GOAL}%</b><small>${range}</small></div></div><span class="wpill" style="color:${col};border-color:${col}">${label}</span></div>
    <div class="row" style="margin-top:12px;align-items:flex-end"><div class="big" style="font-size:34px">${Math.round(g.pct)}<small>%</small></div><span class="mute" style="font-size:12px;text-align:right">${n1(a.s)} / ${n1(a.d)} pts<br>goal line: ${n1(g.target)} pts</span></div>
    <div style="position:relative;height:10px;background:var(--fill);border-radius:99px;margin:10px 0 4px;overflow:visible"><i style="display:block;height:100%;width:${g.pct}%;background:${col};border-radius:99px"></i><span style="position:absolute;top:-4px;bottom:-4px;left:${GOAL}%;width:2px;background:var(--ink);opacity:.7;border-radius:2px"></span></div>
    <p class="sub" style="margin:6px 0 10px">${msg}</p>
    <div style="display:flex;gap:6px">${days}</div>
    <div class="row" style="margin-top:12px"><span class="mute" style="font-size:12px">Edit weekly goal</span><div class="pctbox"><input class="inp" type="number" inputmode="numeric" min="10" max="100" data-goal value="${GOAL}" aria-label="Weekly goal percent"><span>%</span></div></div>
  </div>`;
}

function weeksOf(keys) {
  const g = {}, yr = keys.length ? keys[0].slice(0, 4) : "";
  keys.forEach(k => {
    const md = monday(k);
    const id = ks(md.getFullYear(), md.getMonth(), md.getDate());
    (g[id] = g[id] || []).push(k);
  });
  // a week belongs to the year of its Monday and always uses its full Mon–Sun range (no split at 31 Dec / 1 Jan)
  const all = Object.keys(g).sort().filter(id => id.slice(0, 4) === yr).map(id => {
    const md = new Date(id + "T00:00:00"), full = [];
    for (let i = 0; i < 7; i++) { const x = new Date(md); x.setDate(md.getDate() + i); full.push(ks(x.getFullYear(), x.getMonth(), x.getDate())); }
    return { id, keys: full, ...agg(full, true) };
  });
  const first = all.findIndex(w => w.n > 0);
  if (first < 0) return [];
  return all.slice(first).filter(w => w.workingDays > 0);
}

function calcStreak() {
  const today = TD();
  let streak = 0;
  const curr = new Date();
  for (let i = 0; i < 4000; i++) {
    const k = ks(curr.getFullYear(), curr.getMonth(), curr.getDate());
    if (k < FIRSTK) break;
    const mx = maxFor(k);
    if (mx) {
      const dd = dayDone(k), need = 20 * GOAL / 100;
      if (dd != null && dd >= need) streak++;
      else if (k !== today) break; // today not done yet: keep yesterday's streak alive
    }
    curr.setDate(curr.getDate() - 1);
  }
  return streak;
}

const f = p => (p == null ? "–" : Math.round(p) + "%");

// Unlimited Lifetime Years (2025 to 2035+)

};

// Nothing Glyph 36-Point Ring
function dotRing(p, sz) {
  const N = 36, r = sz / 2 - 7, o = sz / 2, k = Math.round(Math.min(1, (p || 0) / 100) * N);
  let d = "";
  for (let i = 0; i < N; i++) {
    const a = (i / N) * 2 * Math.PI - Math.PI / 2;
    const on = i < k;
    d += `<circle cx="${(o + r * Math.cos(a)).toFixed(1)}" cy="${(o + r * Math.sin(a)).toFixed(1)}" r="${on ? 2.8 : 1.6}" style="fill:${on ? 'var(--brand)' : 'var(--ring-off)'}"/>`;
  }
  return `<svg class="ring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">${d}<text x="50%" y="50%" text-anchor="middle" dy=".35em" class="rt" fill="var(--ink)">${Math.round(p || 0)}%</text></svg>`;
}

// Modern Smooth SVG Arc Ring
function smoothRing(p, sz) {
  const sw = 9, r = sz / 2 - sw, C = 2 * Math.PI * r, o = sz / 2, v = Math.min(1, (p || 0) / 100);
  return `<svg class="ring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle class="rtrack" cx="${o}" cy="${o}" r="${r}" fill="none" stroke-width="${sw}"/>${v > 0 ? `<circle class="rarc" cx="${o}" cy="${o}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C * v} ${C}" transform="rotate(-90 ${o} ${o})"/>` : ""}<text x="50%" y="50%" text-anchor="middle" dy=".35em" class="rt" fill="var(--ink)">${Math.round(p || 0)}%</text></svg>`;
}

function ring(p, sz) {
  return (S.cfg.style || "nothing") === "modern" ? smoothRing(p, sz) : dotRing(p, sz);
}

function nbar() {
  const d = new Date();
  const bar = `<div class="nbar"><span class="led"></span><b>NUCLEAR SYSTEM</b><em>${DN[d.getDay()].toUpperCase()} ${d.getDate()} ${MN[d.getMonth()].slice(0, 3).toUpperCase()} ${d.getFullYear()}</em></div>`;
  if (S.cfg.style !== "blend") return bar;
  return bar + `<div class="clk"><b id="clkb">${pad(d.getHours())}:${pad(d.getMinutes())}</b><small><i></i>LOCAL TIME</small></div>`;
}

function plan() {
  const k = S.pd, dt = new Date(k + "T00:00:00"), dow = dt.getDay(), e = S.d[k] || {};

  const md = monday(k), wk = [];
  for (let i = 0; i < 7; i++) { const x = new Date(md); x.setDate(md.getDate() + i); wk.push(ks(x.getFullYear(), x.getMonth(), x.getDate())); }
  const w = agg(wk, true), streak = calcStreak(), currentCats = cats();

  <div class="dnav">

    ${k!==TD()?`<button class="back" data-today>Today</button>`:""}

      <div class="cat">WEEKLY REVIEW</div><textarea class="mn" data-note="${k}" placeholder="What did you revise? What needs improvement next week?">${esc(e.n||"")}</textarea>

    <p class="sub">${done} of ${dayTasks.length} tasks completed</p><h2>${k === TD() ? "Today's note" : "Day note"}</h2><textarea class="mn" data-note="${k}" placeholder="How did the day go?">${esc(e.n||"")}</textarea></div>
  <div class="dcard"><h2>This week's plan</h2><p class="sub">${w.d} points available for this week (${n1(w.s)} earned). Sunday is revision day.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${wk.map(x=>{const dd=new Date(x+"T00:00:00"),v=dayDone(x)||0;return `<div style="background:var(--fill);border:1px solid var(--line);border-radius:16px;padding:11px;${x===k?"border-color:var(--brand)":""}"><b>${DN[dd.getDay()]} ${dd.getDate()}</b><div style="font:700 17px Sora, sans-serif;margin-top:5px">${dd.getDay()===0?"REVISION":v.toFixed(1)+" / 20"}</div></div>`}).join("")}</div></div>`;

function heat() {
  let h = "";
  for (let m = 0; m < 12; m++) {
    const n = new Date(S.y, m + 1, 0).getDate();
    h += `<div class="hr"><b>${MN[m].slice(0, 3)}</b>`;
    for (let d = 1; d <= n; d++) {
      const kk = ks(S.y, m, d), mxh = maxFor(kk), t = mxh ? dayDone(kk) : null;
      let bgStyle = "";
      if (t != null && t > 0) {
        bgStyle = `style="background:color-mix(in srgb,var(--brand) ${Math.round(20 + (Math.min(t, mxh) / mxh) * 80)}%,var(--card))"`;

    }
    h += `</div>`;
  }
  return h;
}

function dash() {
  const allYearKeys = [], monthAggs = [];
  for (let m = 0; m < 12; m++) {
    const k = monthKeys(S.y, m);
    // Month denominator: ALL eligible working days of the month × 20
    const a = agg(k, true);
    monthAggs.push(a);
    allYearKeys.push(...k);
  }

  // Year denominator: ALL eligible working days of the year × 20
  const yr = agg(allYearKeys, true);
  const ws = weeksOf(allYearKeys);

  const has = monthAggs.map((a, i) => a.p == null ? null : i).filter(i => i != null);
  const d = has.length > 1 ? monthAggs[has[has.length - 1]].p - monthAggs[has[0]].p : null;
  const today0 = TD();
  const wOpen = w => w.keys.some(k => k >= today0 && maxFor(k) > 0);      // week still in progress
  const wsDone = ws.filter(w => !wOpen(w) || w.p >= GOAL);                // an unfinished week counts only once it hits the goal
  const hit = wsDone.filter(w => w.p >= GOAL).length;

  let st = 0;
  for (let i = ws.length - 1; i >= 0; i--) {
    if (ws[i].p >= GOAL) st++;
    else if (wOpen(ws[i])) continue;   // in-progress week below goal must not reset the streak
    else break;
  }
  const bw = ws.length ? ws.reduce((a, b) => ((b.p || 0) > (a.p || 0) ? b : a)) : null;
  const bm = has.length ? has.reduce((a, b) => ((monthAggs[b].p || 0) > (monthAggs[a].p || 0) ? b : a)) : null;

  const wd = [1, 2, 3, 4, 5, 6, 0].map(dw => {
    let s = 0, n = 0, has = false;
    allYearKeys.forEach(k => {
      if (new Date(k + "T00:00:00").getDay() !== dw) return;
      const mx = maxFor(k);
      if (!mx) return;
      has = true;
      if (k < FIRSTK || k > TD()) return;
      const dd = dayDone(k);
      if (dd == null && k === TD()) return;      // today not logged yet
      s += Math.min(dd || 0, mx); n += mx;       // skipped past days count as 0, like week/month totals
    });
    return { dw, has, p: n ? (s / n) * 100 : null };
  }).filter(x => x.has);
  const wv = wd.filter(x => x.p != null);
  const bd = wv.length ? wv.reduce((a, b) => b.p > a.p ? b : a) : null;
  const lw = wv.length ? wv.reduce((a, b) => b.p < a.p ? b : a) : null;

  const T = (n, v, l) => `
    <div class="tile">
      <div class="ic">${ic(n, 18)}</div>
      <div class="tv">${v}</div>
      <div class="tl">${l}</div>

  return `

    ${yearSel()}
  </div>

  <div class="hero dh">

    ${T("flame", `${st}<small> weeks</small>`, "Goal Streak")}
    ${T("trophy", bw && bw.p != null ? Math.round(bw.p) + "<small>%</small>" : "–", "Best Week")}
    ${T("star", bm != null && monthAggs[bm].p != null ? MN[bm].slice(0, 3) + " <small>" + Math.round(monthAggs[bm].p) + "%</small>" : "–", "Best Month")}
  </div>

  <div class="dcard">
    <h2>Monthly Discipline Progress</h2>
    <p class="sub">Points earned ÷ full month target (20 per working day of that month)</p>
    ${monthBars(monthAggs)}
  </div>

  <div class="dcard">
    <h2>Weekly vs Goal</h2>
    <p class="sub">Score = points earned ÷ available points for that calendar week (20 per eligible working day)</p>
    ${weekChart(ws)}
  </div>

  <div class="dcard">
    <h2>Strongest weekday</h2>
    <p class="sub">Average score by weekday</p>
    ${wd.map(x => `
      <div class="wd">
        <span>${DN[x.dw]}</span>
        <div class="wb"><i style="width:${x.p || 0}%"></i></div>
        <b>${f(x.p)}</b>
      </div>
    `).join("")}
    <div class="chips">
      ${bd ? `<span>${ic("trophy", 14)} Best: ${DN[bd.dw]} ${f(bd.p)}</span>` : ""}
      ${lw && lw !== bd ? `<span>${ic("alert", 14)} Focus needed: ${DN[lw.dw]} ${f(lw.p)}</span>` : ""}

}

function catDefaultSplit() {
  const cs = cats(), sum = cs.map(() => 0);
  VIS().forEach(t => { if (sum[t[1]] != null) sum[t[1]] += Math.max(0, Number(t[4]) || 0); });
  const tot = sum.reduce((a, b) => a + b, 0);
  const out = cs.map((_, i) => tot > 0 ? Math.round(sum[i] * 20 / tot * 2) / 2 : Math.round(20 / cs.length * 2) / 2);
  const diff = Math.round((20 - out.reduce((a, b) => a + b, 0)) * 2) / 2;
  if (out.length) out[out.length - 1] = Math.max(0, out[out.length - 1] + diff);
  return out;
}
function catEd() {
  const on = !!S.cfg.catPts, cs = cats();

  return head + cs.map((x, i) => `

}

// ---------- colour engine ----------
function hexRgb(h) {
  h = String(h || "#eb0028").replace("#", "");
  if (h.length === 3) h = h.split("").map(x => x + x).join("");
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function lum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]);
}
function rgb2hsl(c) {
  const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0, l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  if (s === 0) { const v = Math.round(l * 255); return [v, v, v]; }
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const t = x => { x = (x + 1) % 1; return x < 1/6 ? p + (q - p) * 6 * x : x < 1/2 ? q : x < 2/3 ? p + (q - p) * (2/3 - x) * 6 : p; };
  return [t(h + 1/3), t(h), t(h - 1/3)].map(v => Math.round(v * 255));
}
const toHex = c => "#" + c.map(v => v.toString(16).padStart(2, "0")).join("");

// One-time migration: adds Evening Exercise + Evening Book Reading (Mon–Sat) to saved setups
// and rebalances weights so a full day is still 20 points. Past days are frozen first, so history never changes.
function migrateEvening() {
  const c = S.cfg;
  if (c.mig >= 1) return;
  c.mig = 1;
  const hasData = Object.values(S.d).some(e => e && e.t != null);
  if (!c.tasks && !hasData) { save(); return; }       // fresh start: the new defaults already include them
  if (!c.tasks) {
    c.tasks = DEFT.filter(t => DEFT_V0[t[0]] != null).map(t => ({
      id: t[0], cat: t[1], name: (c.names || {})[t[0]] || t[2](1),
      points: DEFT_V0[t[0]], sat: "", sch: JSON.parse(JSON.stringify(DEFSCH))
    }));
  }
  TASKS = buildTasks();
  freezeHistory();                                     // lock every logged day under the old setup
  const now = new Date(), tod = TD(), logged = S.d[tod] && S.d[tod].t != null;
  const from = logged ? ks(now.getFullYear(), now.getMonth(), now.getDate() + 1) : tod;
  const active = c.tasks.filter(t => !t.gone);
  const untouched = active.length === Object.keys(DEFT_V0).length &&
    active.every(t => DEFT_V0[t.id] != null && Number(t.points) === DEFT_V0[t.id]);
  if (untouched) {
    active.forEach(t => { const d = DEFT.find(x => x[0] === t.id); if (d) t.points = d[3]; });
  } else {
    const sum = active.reduce((a, t) => a + (Number(t.points) || 0), 0);
    if (sum > 0) active.forEach(t => { t.points = Math.round((Number(t.points) || 0) * 16.5 / sum * 10) / 10; });
  }
  ["exe", "bookev"].forEach(id => {
    if (c.tasks.some(t => t.id === id)) return;
    const d = DEFT.find(x => x[0] === id);
    c.tasks.push({ id, cat: d[1], name: d[2](1), points: id === "exe" ? 2 : 1.5, sat: "",
      sch: [{ from, days: [1, 2, 3, 4, 5, 6], rep: "every" }] });
  });
  S.tmsg = "Added Evening Exercise (2 pts) and Evening Book Reading (1.5 pts), Mon–Sat. Points rebalanced so a full day is still 20.";
  save();
}

function applyCfg() {
  migrateEvening();
  const r = document.documentElement, c = S.cfg;
  TASKS = buildTasks();
  MAX = 20;

  applyLook();
  GOAL = Math.min(100, Math.max(10, Number(c.goal) || 50));

}

function doRestore(v) {
  const isObj = x => x && typeof x === "object" && !Array.isArray(x);
  const validDateKey = k => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return false;
    const d = new Date(k + "T00:00:00");
    return !Number.isNaN(d.getTime()) && ks(d.getFullYear(), d.getMonth(), d.getDate()) === k;
  };
  try {
    const o = typeof v === "string" ? JSON.parse(v) : v;
    if (!isObj(o) || !isObj(o.d) || !isObj(o.m || {}) || !isObj(o.cfg || {})) throw new Error("structure");
    if (Object.keys(o.d).length > 20000) throw new Error("size");
    const nd = {};
    for (const [k, e] of Object.entries(o.d)) {
      if (!validDateKey(k) || !isObj(e)) throw new Error("date");
      const ne = { n: typeof e.n === "string" ? e.n.slice(0, 10000) : "", t: e.t == null ? null : Number(e.t) };
      if (ne.t != null && (!Number.isFinite(ne.t) || ne.t < 0 || ne.t > 20.0001)) throw new Error("score");
      if (ne.t != null) ne.t = Math.min(20, ne.t);
      if (e.c != null) {
        if (!Array.isArray(e.c) || e.c.length > 200 || e.c.some(id => typeof id !== "string")) throw new Error("checklist");
        ne.c = [...new Set(e.c)];
      }
      if (e.f != null) {
        if (!isObj(e.f)) throw new Error("partial"); ne.f = {};
        for (const [id, fv] of Object.entries(e.f)) { const n = Number(fv); if (id && Number.isFinite(n) && n >= 0 && n <= 1) ne.f[id] = n; }
      }
      if (e.p != null) {
        if (!isObj(e.p)) throw new Error("points"); ne.p = {};
        for (const [id, points] of Object.entries(e.p)) {
          const n = Number(points); if (!id || !Number.isFinite(n) || n < 0 || n > 20.0001) throw new Error("points"); ne.p[id] = Math.min(20, n);
        }
      }
      if (e.snap != null) {
        if (!isObj(e.snap)) throw new Error("snap"); ne.snap = {};
        for (const [id, snap] of Object.entries(e.snap)) {
          if (!isObj(snap)) throw new Error("snap");
          ne.snap[id] = { name: typeof snap.name === "string" ? snap.name.slice(0,200) : "",
            cat: Number.isInteger(snap.cat) && snap.cat >= 0 ? snap.cat : 0,
            catName: typeof snap.catName === "string" ? snap.catName.slice(0,100) : "",
            catIcon: typeof snap.catIcon === "string" ? snap.catIcon.slice(0,40) : "star" };
        }
      }
      nd[k] = ne;
    }
    const nm = {};
    for (const [k, val] of Object.entries(o.m || {})) if (typeof val === "string") nm[String(k).slice(0,30)] = val.slice(0,10000);
    const cfgIn = o.cfg || {}, nc = { ...mk(), ...cfgIn };
    if (cfgIn.tasks != null) {
      if (!Array.isArray(cfgIn.tasks) || cfgIn.tasks.length > 100) throw new Error("tasks");
      const ids = new Set();
      nc.tasks = cfgIn.tasks.map(t => {
        const defaultPoints = (DEFT.find(q => q[0] === (t && t.id)) || [null,null,null,1])[3];
        const taskPointsValue = t && t.points != null ? Number(t.points) : defaultPoints;
        if (!isObj(t) || typeof t.id !== "string" || !t.id || ids.has(t.id) || typeof t.name !== "string" ||
            !Number.isFinite(taskPointsValue) || taskPointsValue < 0 || taskPointsValue > 20) throw new Error("task");
        ids.add(t.id);
        const sch = Array.isArray(t.sch) ? t.sch.filter(v => isObj(v) && (v.from === "" || validDateKey(v.from)) &&
          Array.isArray(v.days) && v.days.every(d => Number.isInteger(d) && d >= 0 && d <= 6) &&
          ["every","alt0","alt1","m1","m2","m3","m4","mlast"].includes(v.rep || "every")) : [];
        return { id: t.id.slice(0,100), name: t.name.slice(0,200), cat: Math.max(0, Math.min(99, Number(t.cat)||0)),
          points: taskPointsValue, part: !!t.part, mins: Math.max(0, Math.min(1440, Math.round(Number(t.mins)) || 0)), sat: typeof t.sat === "string" ? t.sat.slice(0,200) : "", gone: !!t.gone,
          dn: (() => { const o = {}; if (isObj(t.dn)) for (let d = 0; d <= 6; d++) if (typeof t.dn[d] === "string" && t.dn[d].trim()) o[d] = t.dn[d].trim().slice(0,200); return o; })(),
          sch: sch.length ? sch : JSON.parse(JSON.stringify(DEFSCH)) };
      });
    }
    if (cfgIn.cats != null) {
      if (!Array.isArray(cfgIn.cats) || cfgIn.cats.length > 30) throw new Error("cats");
      nc.cats = cfgIn.cats.map(c => { if (!isObj(c) || typeof c.n !== "string") throw new Error("cat"); const r = { n:c.n.slice(0,100), ic:ICONS[c.ic] ? c.ic : "star" }; if (c.pts != null && Number.isFinite(Number(c.pts))) r.pts = Math.max(0, Math.min(20, Number(c.pts))); return r; });
    }
    nc.catPts = !!nc.catPts;
    nc.nuke = nkClean(cfgIn.nuke);
    nc.theme = ["auto", "dark", "light"].includes(nc.theme) ? nc.theme : "dark";
    nc.style = ["modern", "blend", "nothing"].includes(nc.style) ? nc.style : "nothing";
    nc.pal = typeof nc.pal === "string" && (nc.pal === "custom" || PL.some(q => q.id === nc.pal)) ? nc.pal : "";
    nc.amoled = !!nc.amoled;
    nc.hfx = HFX.some(q => q[0] === nc.hfx) ? nc.hfx : "glass";
    nc.classic = !!nc.classic;
    nc.ccl = Array.isArray(nc.ccl) ? nc.ccl.filter(h => typeof h === "string" && /^#[0-9a-f]{6}$/i.test(h)).slice(-8) : [];
    nc.goal = Math.max(10, Math.min(100, Math.round(Number(nc.goal)) || 50));
    nc.start = typeof nc.start === "string" && /^\d{4}-\d{2}-\d{2}$/.test(nc.start) ? nc.start : "";
    if (typeof nc.ac !== "string" || !/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(nc.ac)) nc.ac = "#eb0028";
    if (!isObj(nc.names)) nc.names = {};
    const old = { d:S.d, m:S.m, cfg:S.cfg };
    S.d = nd; S.m = nm; S.cfg = nc;
    if (!save()) { S.d=old.d; S.m=old.m; S.cfg=old.cfg; throw new Error("storage"); }
    S.se=null; S.nts=null; S.delArm=null; applyCfg();
    S.msg = `✅ Restored ${Object.keys(S.d).length} days of data.`;
  } catch(e) {
    S.msg = String(e && e.message) === "storage" ? "❌ Restore could not be saved. Existing data was kept; free storage or download a backup." : "❌ Backup rejected: invalid or unsupported data. Existing data was kept.";
  }
  render();
}

function copyText(txt) {
  return new Promise((res, rej) => {
    const fb = () => {
      try {
        const ta = document.createElement("textarea");
        ta.value = txt;
        ta.setAttribute("readonly", "");
        ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        ok ? res() : rej();
      } catch (e) { rej(e); }
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(res, fb);
    else fb();
  });
}

function setFrac(id, f) {
  const entry = S.d[S.pd] || (S.d[S.pd] = { t: 0, n: "" });
  freezePoints(S.pd);
  if (!Array.isArray(entry.c)) entry.c = [];
  if (!entry.c.includes(id)) entry.c.push(id);
  if (!entry.f || typeof entry.f !== "object") entry.f = {};
  f = Math.max(0, Math.min(1, f));
  if (f >= 1) delete entry.f[id]; else entry.f[id] = f;
  entry.t = scoreOf(entry, S.pd);
  save(); render();
}
function act(a) {
  if (a === "cmno") { S.cm = null; return render(); }
  if (a === "cmyes") { const y = S.cm && S.cm.yes; S.cm = null; render(); if (y) act(y); return; }
  if (a.startsWith("nk")) return nkAct(a);
  if (a.startsWith("catpts:")) {
    clickAudio(); haptic(10);
    freezeHistory();   // past days keep the points they had
    if (a === "catpts:on") {
      const sp = catDefaultSplit(), cs = ownCats();
      cs.forEach((c, i) => { if (c.pts == null) c.pts = sp[i]; });
      S.cfg.catPts = true;
    } else S.cfg.catPts = false;
    save(); applyCfg(); return render();
  }
  if (a.startsWith("tpart:")) {
    clickAudio(); haptic(10);
    const x = ownTasks().find(q => q.id === a.slice(6));
    if (x) x.part = !x.part;
    save(); applyCfg(); return render();
  }
  if (a.startsWith("fr:")) {
    clickAudio(); haptic(12);
    const [, id, v] = a.split(":");
    return setFrac(id, (+v || 0) / 100);
  }
  if (a === "toggleTheme") {
    clickAudio();
    haptic(15);
    S.cfg.theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    save();
    applyCfg();
    return render();
  }

  if (a.startsWith("lk:")) {
    clickAudio(); haptic(10);
    const k = a.slice(3);
    S.lookSub = S.lookSub === k ? null : k;
    return render();
  }

  if (a === "tgl:data") {
    clickAudio(); haptic(10);
    S.dataOpen = !S.dataOpen;
    return render();
  }

  if (a === "tgl:look" || a === "tgl:prefs") {
    clickAudio(); haptic(10);
    const key = a === "tgl:look" ? "lookOpen" : "prefsOpen";
    S[key] = !S[key];
    return render();
  }

  if (a === "tgl:cats") {
    clickAudio(); haptic(10);
    S.catsOpen = !S.catsOpen;
    return render();
  }

  if (a === "tgl:nuke") {
    clickAudio(); haptic(10);
    S.nukeOpen = !S.nukeOpen;
    return render();
  }

  if (a === "tgl:tasks") {
    clickAudio(); haptic(10);
    S.tasksOpen = !S.tasksOpen;
    if (!S.tasksOpen) { S.se = null; S.delArm = null; }
    return render();
  }

  if (a.startsWith("pal:")) {
    const id = a.slice(4);
    if (PL.some(q => q.id === id)) { S.cfg.pal = id; save(); applyLook(); return render(); }
    return;
  }
  if (a === "ccopen") { S.ccOpen = !S.ccOpen; return render(); }
  if (a === "look:classic" || a === "look:new") { S.cfg.classic = a === "look:classic"; save(); applyLook(); return render(); }
  if (a.startsWith("hfx:")) { const v = a.slice(4); if (HFX.some(q => q[0] === v)) { S.cfg.hfx = v; save(); applyLook(); return render(); } return; }
  if (a === "amoled") { S.cfg.amoled = !S.cfg.amoled; save(); applyLook(); return render(); }
  if (a.startsWith("ccpre:")) { ccPreset(a.slice(6)); return; }
  if (a === "ccadd") { ccAdd(); return; }
  if (a.startsWith("ccpick:")) {
    const h = ccNorm(a.slice(7));
    if (h) { S.cfg.ac = h; S.cfg.pal = "custom"; save(); applyLook(); return render(); }
    return;
  }
  if (a.startsWith("ccrm:")) {
    const h = a.slice(5);
    S.cfg.ccl = (S.cfg.ccl || []).filter(x => x !== h);
    if (S.cfg.ac === h) {
      if (S.cfg.ccl.length) S.cfg.ac = S.cfg.ccl[S.cfg.ccl.length - 1];
      else { S.cfg.ac = "#eb0028"; S.cfg.pal = "nuclear"; }
    }
    save(); applyLook(); render(); nxToast("Colour removed");
    return;
  }
  if (a.startsWith("fxtest:")) {
    if (a === "fxtest:h") {
      if (!navigator.vibrate) return nxToast("Vibration is not supported on this device");
      if (!S.cfg.haptic) return nxToast("Haptic vibration is turned off");
      fx("ok", "h");
    } else {
      if (!S.cfg.sound) return nxToast("Sound effects are turned off");
      fx("ok", "s");
    }
    return;
  }
  if (a.startsWith("theme:")) {
    clickAudio(); haptic(15);
    const tv = a.slice(6);
    S.cfg.theme = ["auto", "dark", "light"].includes(tv) ? tv : "dark";
    save(); applyLook();
    return render();
  }

  if (a.startsWith("hs:")) {
    S.cfg.hstr = +a.slice(3) || 3;
    save(); fx("press", "h");
    return render();
  }

  if (a.startsWith("jump:")) {
    clickAudio(); haptic(10);
    if (a === "jump:tasks" && !S.tasksOpen) { S.tasksOpen = true; render(); }
    if (a === "jump:cats" && !S.catsOpen) { S.catsOpen = true; render(); }
    if (a === "jump:look" && !S.lookOpen) { S.lookOpen = true; render(); }
    if (a === "jump:data" && !S.dataOpen) { S.dataOpen = true; render(); }
    if (a === "jump:prefs" && !S.prefsOpen) { S.prefsOpen = true; render(); }
    const el = document.getElementById("cfg-" + a.slice(5));
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  if (a.startsWith("sch:")) {
    clickAudio(); haptic(10);
    const id = a.slice(4);
    S.se = S.se === id ? null : id;
    return render();
  }

  if (a.startsWith("sd:") || a.startsWith("sp:")) {
    clickAudio(); haptic(10);
    const [kind, id, val] = a.split(":");
    const cur = id === "new" ? S.nts : lastSch(TASKS.find(x => x[0] === id));
    let days = [...cur.days];
    if (kind === "sd") {
      const d = +val;
      days = days.includes(d) ? days.filter(x => x !== d) : [...days, d];
      days = days.filter(x => x !== 0);   // Sunday is the revision day, never a task day
      if (!days.length) { S.tmsg = "Select at least one day."; return render(); }
    } else {
      days = { all: [1, 2, 3, 4, 5, 6], wk: [1, 2, 3, 4, 5], sat: [1, 2, 3, 4, 5, 6], we: [6] }[val];
    }
    if (id === "new") { S.nts.days = days; S.tmsg = ""; return render(); }
    return setSched(id, { days });
  }

  if (a === "add") {
    freezeHistory();
    const n = ((document.getElementById("nt") || {}).value || "").trim();
    const c = +(document.getElementById("ntc") || {}).value || 0;
    S.ntName = n; S.ntc = c;
    if (!n) { S.tmsg = "Enter a task name."; return render(); }
    if (VIS().length >= 15) { S.tmsg = "Maximum 15 tasks."; return render(); }
    const nts = S.nts || { days: [1, 2, 3, 4, 5, 6], rep: "every" };
    const ndn = {}; nts.days.forEach(d => { const x = ((nts.dn || {})[d] || "").trim(); if (x) ndn[d] = x; });
    ownTasks().push({ id: "t" + Date.now().toString(36), cat: c, name: n, points: 1, sat: "", dn: ndn, sch: [{ from: TD(), days: [...nts.days], rep: nts.rep }] });
    S.ntName = ""; S.nts = null;
    save();
    applyCfg();
    S.tmsg = "Task added.";
    return render();
  }

  if (a.startsWith("del:")) {
    const did = a.slice(4), tkx = ownTasks().find(x => x.id === did);
    if (VIS().length <= 1) { S.tmsg = "Keep at least one task."; return render(); }
    S.cm = { title: "Delete this task?", msg: "\u201C" + (tkx ? tkx.name : "Task") + "\u201D will be removed from your schedule. Past days keep their score.", yes: "delgo:" + did };
    return render();
  }
  if (a.startsWith("delgo:")) {
    const did = a.slice(6);
    S.delArm = null;
    freezeHistory();
    if (VIS().length <= 1) { S.tmsg = "Keep at least one task."; return render(); }
    const tk = ownTasks().find(x => x.id === did);
    if (tk) {
      // keep it for history; stop scheduling it from today onward
      tk.gone = true;
      if (!tk.sch || !tk.sch.length) tk.sch = JSON.parse(JSON.stringify(DEFSCH));
      const last = tk.sch[tk.sch.length - 1];
      const tomorrowDate = new Date(TD() + "T00:00:00"); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      const tomorrow = ks(tomorrowDate.getFullYear(), tomorrowDate.getMonth(), tomorrowDate.getDate());
      tk.sch.push({ ...last, days: [], from: tomorrow });
    }
    if (S.se === did) S.se = null;
    save();
    applyCfg();
    S.tmsg = "Task removed.";
    return render();
  }

  if (a === "copy" || a === "dl") {
    S.bk = bkJson();
    S.arm = false;
    if (a === "dl") {
      try {
        const u = URL.createObjectURL(new Blob([S.bk], { type: "application/json" }));
        const x = document.createElement("a");
        x.href = u;
        x.download = "nuclear-system-backup-" + S.pd + ".json";
        document.body.appendChild(x);
        x.click();
        x.remove();
        setTimeout(() => URL.revokeObjectURL(u), 5000);
        S.msg = "✅ Backup downloaded.";
        if (S.modal) S.modal.note = "Backup downloaded.";
      } catch(e) {
        S.msg = "Download failed. Copy the text below instead.";
      }
    } else {
      copyText(S.bk).then(
        () => { S.msg = "✅ Backup copied to clipboard."; render(); },
        () => { S.msg = "Copy the text below manually."; render(); }
      );
    }
    return render();
  }

  if (a === "restore") return doRestore((document.getElementById("rs") || {}).value);

  if (a.startsWith("askReset:")) {
    clickAudio(); haptic(20);
    S.modal = { mode: a.slice(9), text: "", note: "", focus: true };
    return render();
  }
  if (a === "mclose") { clickAudio(); S.modal = null; return render(); }
  if (a === "mconfirm") {
    const m = S.modal;
    if (!m || (m.text || "").trim().toUpperCase() !== "RESET") return;
    S.undo = bkJson();
    S.d = {}; S.m = {};
    if (m.mode === "all") { S.cfg = mk(); S.se = null; S.nts = null; S.ntName = ""; S.ntc = 0; }
    S.modal = null; S.bk = ""; S.msg = "";
    S.rmsg = m.mode === "all" ? "Everything was reset to defaults." : "Progress cleared. Your tasks and settings were kept.";
    save(); applyCfg(); clickAudio(); haptic(30);
    return render();
  }
  if (a === "undo") {
    if (!S.undo) return;
    const u = S.undo;
    S.undo = null;
    doRestore(u);
    S.rmsg = "Your data was restored.";
    return render();
  }
}

const nkDateOk = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && !Number.isNaN(new Date(v + "T00:00:00").getTime());

const addDays = (k, n) => { const [y, m, d] = k.split("-").map(Number); const x = new Date(y, m - 1, d + n); return ks(x.getFullYear(), x.getMonth(), x.getDate()); };

function nk() {
  let n = S.cfg.nuke, fresh = false;
  if (!n || typeof n !== "object" || Array.isArray(n)) { n = S.cfg.nuke = nkDefault(); fresh = true; }
  if (!nkDateOk(n.dl)) n.dl = new Date().getFullYear() + "-12-31";

  if (typeof n.obj !== "string") n.obj = "";

  ["works", "fails", "tasks", "tm"].forEach(k => { if (!Array.isArray(n[k])) n[k] = []; });
  if (!n.ans || typeof n.ans !== "object" || Array.isArray(n.ans)) n.ans = { when: "", what: "" };
  if (fresh) save();
  return n;
}
function nkClean(x) {
  if (!x || typeof x !== "object" || Array.isArray(x)) return null;
  const str = (v, m) => typeof v === "string" ? v.slice(0, m) : "";
  const arr = (a, m) => Array.isArray(a) ? a.slice(0, m) : [];
  const ids = new Set(), uid = v => { let i = str(v, 40) || nkId(); while (ids.has(i)) i = nkId(); ids.add(i); return i; };
  const list = a => arr(a, 300).map(i => ({ id: uid(i && i.id), t: str(i && i.t, 300) }));
  const a = x.ans && typeof x.ans === "object" ? x.ans : {};
  return {
    dl: nkDateOk(x.dl) ? x.dl : new Date().getFullYear() + "-12-31",
    st: nkDateOk(x.st) ? x.st : TD(),
    obj: str(x.obj, 2000), must: str(x.must, 500).trim() || NK_MUST,
    works: list(x.works), fails: list(x.fails), tm: list(x.tm),
    tasks: arr(x.tasks, 1000).filter(t => t && typeof t === "object").map(t => ({
      id: uid(t.id), n: str(t.n, 300), d: nkDateOk(t.d) ? t.d : TD(),

      al: !!t.al, st: NK_ST.some(q => q[0] === t.st) ? t.st : "ns"
    })),
    ans: { when: str(a.when, 5000), what: str(a.what, 5000) }
  };
}
function nkLeft() {
  const n = nk(), now = Date.now();
  const end = new Date(n.dl + "T23:59:59").getTime(), st = new Date(n.st + "T00:00:00").getTime();
  const diff = end - now, over = diff < 0, a = Math.abs(diff), span = end - st;
  return {
    over, d: Math.floor(a / 86400000), h: Math.floor(a % 86400000 / 3600000),
    m: Math.floor(a % 3600000 / 60000), s: Math.floor(a % 60000 / 1000),
    pct: span > 0 ? Math.max(0, Math.min(100, (now - st) / span * 100)) : (over ? 100 : 0)
  };
}
const nkHms = L => (L.over ? "-" : "") + pad(L.h) + ":" + pad(L.m) + ":" + pad(L.s);

      await ref().set({ data: JSON.stringify({ d: S.d, m: S.m, cfg: S.cfg }), updatedAt: ts });
      localStorage.setItem(TSK, String(ts));
      setSt("Synced " + new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
    } catch (e) { setSt("Sync failed: " + (e.code || e.message)); }
  }
  window.save = function () { const r = _save(); if (r && user) { clearTimeout(pt); pt = setTimeout(pushNow, 1500); } return r; };

  function applyCloud(o) {
    S.d = o.d || {}; S.m = o.m || {}; S.cfg = { ...mk(), ...(o.cfg || {}) };
    _tfc.clear(); _tpc.clear(); _save(); applyCfg(); render();
  }
  async function pull() {
    if (!user) return;
    try {
      setSt("Syncing…");
      const snap = await ref().get();
      if (!snap.exists) return pushNow();
      const c = snap.data(), cts = c.updatedAt || 0, lts = +localStorage.getItem(TSK) || 0;
      if (cts > lts) {
        const hasLocal = Object.keys(S.d).length > 0;
        if (lts === 0 && hasLocal && !confirm("Cloud par data mila. OK = cloud data load karo (is device ka data replace hoga). Cancel = is device ka data cloud par upload karo.")) return pushNow();
        applyCloud(JSON.parse(c.data));
        localStorage.setItem(TSK, String(cts));
        setSt("Loaded from cloud");
      } else await pushNow();
    } catch (e) { setSt("Sync failed: " + (e.code || e.message)); }
  }

  window.accountCard = () => {
    const chR = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
    const person = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
    const row = (tag, attrs, tile, t, sub, end) => `<${tag} class="acc-hd" ${attrs}><span class="cic">${tile}</span><div><b>${t}</b><small>${sub}</small></div><span class="acc-ch">${end}</span></${tag}>`;
    const note = `<p class="note" id="cloud-st">${esc(st)}</p>`;
    if (!ok) {
      const noCfg = !FIREBASE_CONFIG.apiKey || /^YOUR_/.test(FIREBASE_CONFIG.apiKey);
      const web = /^https?:$/.test(location.protocol);
      const why = noCfg ? "Firebase config is missing" : (web ? "Firebase load nahi hua · tap to retry" : "Sign-in works on the hosted https link");
      return `<div class="dcard acc" id="cfg-acct">${row(web && !noCfg ? "button" : "div", web && !noCfg ? 'data-cloud="retry"' : "", person, "Google account", why, web && !noCfg ? chR : "")}${note}</div>`;
    }
    if (!user) return `<div class="dcard acc" id="cfg-acct">${row("button", 'data-cloud="in"', person, "Google account", "Sign in to back up and sync your data", chR)}${note}</div>`;
    const open = !!S.acctOpen;
    const tile = user.photoURL ? `<img src="${esc(user.photoURL)}" referrerpolicy="no-referrer" alt="">` : person;
    return `<div class="dcard acc ${open ? "open" : ""}" id="cfg-acct">${row("button", 'data-cloud="tgl" aria-expanded="' + open + '"', tile, esc(user.displayName || "Signed in"), esc(user.email || ""), ic(open ? "chevu" : "chevd", 18))}${open ? `<div class="acc-body"><div class="segs" style="margin:6px 0 0"><button class="seg" data-cloud="sync">Sync now</button><button class="seg danger" data-cloud="out">Sign out</button></div>${note}</div>` : note}</div>`;
  };

  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-cloud]"); if (!b) return;
    const a = b.dataset.cloud;
    if (a === "tgl") { S.acctOpen = !S.acctOpen; return render(); }
    if (a === "retry") { location.reload(); return; }
    if (!ok) return setSt("Add your Firebase config in the code first.");
    if (a === "in") {
      const p = new firebase.auth.GoogleAuthProvider();
      p.setCustomParameters({ prompt: "select_account" });
      setSt("Opening Google sign-in…");
      try { await auth.signInWithPopup(p); setSt(""); }
      catch (err) {
        const c = err.code || "";
        if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
          try { await auth.signInWithRedirect(p); } catch (e2) { setSt("Sign-in failed: " + (e2.code || e2.message)); }
        }
        else if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") setSt("Sign-in cancel ho gaya");
        else if (c === "auth/unauthorized-domain") setSt("Is domain ko Firebase Console → Authentication → Settings → Authorized domains me add karo");
        else if (c === "auth/network-request-failed") setSt("Internet check karo, phir dobara try karo");
        else setSt("Sign-in failed: " + (c || err.message));
      }
    } else if (a === "out") { flushSave(); await auth.signOut(); }
    else if (a === "sync") pull();
  });

  if (ok) {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth(); db = firebase.firestore();
    auth.getRedirectResult().catch(e => { setSt("Sign-in failed: " + (e.code || e.message)); });
    auth.onAuthStateChanged(u => { user = u; if (u) pull(); else st = ""; redraw(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && user) pull(); });
  }
})();
</script>
<script>
(() => {
  const KEYN = "nuclear-side-pc";
  const mq = window.matchMedia("(min-width: 768px)");
  let open;
  try { const v = localStorage.getItem(KEYN); open = v === null ? window.innerWidth >= 1100 : v !== "0"; }
  catch (e) { open = window.innerWidth >= 1100; }
  const tog = document.getElementById("sideToggle"), brand = document.getElementById("sideBrand"), tip = document.getElementById("tip");
  function apply() {
    document.body.classList.toggle("nav-x", open);
    if (tog) {
      tog.setAttribute("aria-expanded", open ? "true" : "false");
      tog.setAttribute("aria-label", open ? "Collapse menu" : "Expand menu");
      tog.dataset.tip = open ? "Collapse menu" : "Expand menu";
    }
    hideTip();
  }
  function toggle() {
    open = !open;
    try { localStorage.setItem(KEYN, open ? "1" : "0"); } catch (e) {}
    apply();
  }
  function showTip(el) {
    if (!tip || document.body.classList.contains("nav-x") && !el.classList.contains("chev")) return;
    if (!mq.matches) return;
    tip.textContent = el.dataset.tip || "";
    const r = el.getBoundingClientRect();
    tip.style.left = (r.right + 12) + "px";
    tip.style.top = (r.top + r.height / 2 - tip.offsetHeight / 2) + "px";
    tip.classList.add("show");
  }
  function hideTip() { if (tip) tip.classList.remove("show"); }
  document.querySelectorAll(".side [data-tip]").forEach(el => {
    el.addEventListener("mouseenter", () => showTip(el));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("focus", () => { if (el.matches(":focus-visible")) showTip(el); });
    el.addEventListener("blur", hideTip);
    el.addEventListener("click", hideTip);
  });
  if (tog) tog.addEventListener("click", toggle);
  if (brand) brand.addEventListener("click", toggle);
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!mq.matches) return;
    const ae = document.activeElement;
    if (ae && (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable)) return;
    if (typeof S !== "undefined" && S.modal) return;
    const map = { "1": "nuke", "2": "plan", "3": "dash", "4": "review", "5": "set" };
    if (map[e.key]) { const b = document.querySelector('.side [data-tab="' + map[e.key] + '"]'); if (b) b.click(); }
    else if (e.key === "[" || e.key === "]") toggle();
  });
  apply();
})();
</script>

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => { reg.update().catch(() => {}); }).catch(() => {});
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  });
}
</script>
