<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PWA check</title>
<style>
body{margin:0;padding:18px;background:#000;color:#eee;font:16px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}
.r{padding:10px 12px;margin:8px 0;border-radius:12px;background:#111;border:1px solid #333;word-break:break-all}
.ok{border-color:#2a7;color:#7f9}.bad{border-color:#c33;color:#f88}.warn{border-color:#ca3;color:#fd6}
small{display:block;color:#aaa;margin-top:4px}
button{padding:12px 16px;border-radius:12px;border:0;background:#e22;color:#fff;font-size:16px;margin-top:10px}
</style></head><body>
<h1>PWA check</h1>
<div id="out"></div>
<button id="inst" style="display:none">Install app</button>
<button id="rst">Reset: purana cache + service worker hatao</button>
<script>
const out=document.getElementById("out");
document.getElementById("rst").onclick=async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.href=location.pathname+"?r="+Date.now()};
const add=(t,c,s)=>{const d=document.createElement("div");d.className="r "+c;d.textContent=(c==="ok"?"✅ ":c==="bad"?"❌ ":"⚠️ ")+t;if(s){const m=document.createElement("small");m.textContent=s;d.appendChild(m)}out.appendChild(d)};
let dp=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;add("Chrome ne install allow kar diya (beforeinstallprompt aaya)","ok");const b=document.getElementById("inst");b.style.display="block";b.onclick=()=>dp.prompt()});
(async()=>{
  add("URL: "+location.href,"warn");
  add("HTTPS: "+location.protocol,location.protocol==="https:"?"ok":"bad");
  add("Browser: "+(navigator.userAgent.includes("Brave")?"Brave?":(/Chrome\//.test(navigator.userAgent)?"Chrome-based":"other")),"warn",navigator.userAgent.slice(0,90));
  add("Standalone mode: "+(matchMedia("(display-mode: standalone)").matches?"haan (already installed)":"nahi"),"warn");
  // index link tag
  const link=document.createElement("a");
  let mUrl="manifest.webmanifest";
  try{
    const idx=await fetch("index.html?cb="+Date.now(),{cache:"no-store"});
    if(!idx.ok) add("index.html: HTTP "+idx.status,"bad");
    else{const t=await idx.text();const m=t.match(/<link[^>]+rel="manifest"[^>]+href="([^"]+)"/);
      if(m){mUrl=m[1];add("index.html me manifest link: "+mUrl,"ok");}else add("index.html me <link rel=manifest> NAHI hai (purani index.html upload hai)","bad");
      const ic=[...t.matchAll(/href="([^"]*\.(?:png|svg|ico))"/g)].map(x=>x[1]);
      if(ic.some(x=>x.startsWith("icons/")))add("index.html abhi bhi 'icons/' folder use kar rahi hai — purani file hai, naya index.html upload karo","bad");}
  }catch(e){add("index.html fetch error: "+e.message,"bad")}
  let man=null;
  try{
    const r=await fetch(mUrl+"?cb="+Date.now(),{cache:"no-store"});
    if(!r.ok)add(mUrl+": HTTP "+r.status+" (file repo me nahi hai / naam galat)","bad");
    else{try{man=await r.json();add("manifest.webmanifest mil gaya, JSON sahi","ok")}catch(e){add("manifest JSON invalid: "+e.message,"bad")}}
  }catch(e){add("manifest fetch error: "+e.message,"bad")}
  if(man){
    for(const k of["name","start_url","display","icons"])add("manifest."+k+": "+(man[k]?JSON.stringify(man[k]).slice(0,80):"MISSING"),man[k]?"ok":"bad");
    if(!["standalone","fullscreen","minimal-ui"].includes(man.display))add("display standalone/minimal-ui hona chahiye","bad");
    let has192=false,has512=false;
    for(const i of (man.icons||[])){
      const u=new URL(i.src,new URL(mUrl,location.href)).href;
      try{
        const r=await fetch(u+"?cb="+Date.now(),{cache:"no-store"});
        if(!r.ok){add(i.src+": HTTP "+r.status+" — ye file repo me upload nahi hui","bad");continue}
        const b=await r.blob();const bm=await createImageBitmap(b);
        const okSize=bm.width>=192;
        add(i.src+": "+bm.width+"x"+bm.height+" (manifest me "+i.sizes+")",okSize?"ok":"bad");
        if(bm.width>=192)has192=true;if(bm.width>=512)has512=true;
        if(i.sizes&&i.sizes!==bm.width+"x"+bm.height)add(i.src+" ka asli size manifest ke sizes se match nahi karta","warn");
      }catch(e){add(i.src+": load nahi hua ("+e.message+")","bad")}
    }
    if(!has192||!has512)add("Kam se kam ek 192px aur ek 512px icon chahiye jo sach me load ho","bad");
    const sc=new URL(man.start_url||"./",new URL(mUrl,location.href));
    add("start_url resolve: "+sc.pathname,sc.pathname.startsWith(location.pathname.replace(/[^/]*$/,""))?"ok":"bad");
  }
  if(!("serviceWorker" in navigator))add("Service worker supported nahi","bad");
  else{
    try{
      const r=await fetch("sw.js?cb="+Date.now(),{cache:"no-store"});
      add("sw.js: HTTP "+r.status,r.ok?"ok":"bad");
      const regs=await navigator.serviceWorker.getRegistrations();
      add("Registered service workers: "+regs.length,regs.length?"ok":"warn",regs.map(g=>g.scope+" · "+(g.active?g.active.state:"no active")).join("\n"));
      add("Page controlled by SW: "+(navigator.serviceWorker.controller?"haan":"nahi (index.html kholkar 2 baar reload karo)"),navigator.serviceWorker.controller?"ok":"warn");
    }catch(e){add("SW check error: "+e.message,"bad")}
  }
  setTimeout(()=>{if(!dp)add("beforeinstallprompt nahi aaya: upar jo ❌ hai wo theek karo, ya app already install hai, ya browser Chrome nahi hai","warn")},2500);
})();
</script></body></html>
